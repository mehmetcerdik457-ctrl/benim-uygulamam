services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "backend/server.py"]
    env_file:
      - .env
    environment:
      PORT: "8080"
    volumes:
      - .:/app:ro
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
