# Local-only Compose draft. Binds only to loopback; no public endpoint is created.
# Supply OPENAI_API_KEY in the invoking shell. Never commit a .env file or key.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your shell for a real provider test}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:8080:8080"
    restart: "no"
