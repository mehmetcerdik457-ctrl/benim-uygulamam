name: OMEGA provider smoke offline acceptance

on:
  pull_request:
    paths:
      - "scripts/omega_provider_smoke.py"
      - "tests/test_omega_provider_smoke.py"
      - "tests/test_omega_provider_request_cap.py"
      - "tests/test_omega_backend_error_redaction.py"
      - "tests/test_omega_provider_rate_limit_identity.py"
      - "backend/server.py"
      - ".github/workflows/omega-provider-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test smoke and per-request cap contracts without provider credentials
        env:
          CI: "1"
          OMEGA_SINGLE_PROVIDER_PROBE_APPROVED: "NO"
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m compileall -q backend scripts tests
          python -m pytest -q tests/test_omega_provider_smoke.py tests/test_omega_provider_request_cap.py tests/test_omega_backend_error_redaction.py tests/test_omega_provider_rate_limit_identity.py
