name: Exact Model Router Snapshot

on:
  push:
    branches:
      - artifact/model-router-snapshot-20260925

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact router head
        uses: actions/checkout@v4
        with:
          ref: a6b54bd20bde56d4e80f259c6aa6b86685866488
          fetch-depth: 1

      - name: Verify and package exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="a6b54bd20bde56d4e80f259c6aa6b86685866488"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "EXACT_HEAD=$ACTUAL"
          git archive --format=zip --prefix=MEHMET_AI_MODEL_ROUTER_a6b54bd/ --output=MEHMET_AI_MODEL_ROUTER_a6b54bd.zip "$EXPECTED"
          sha256sum MEHMET_AI_MODEL_ROUTER_a6b54bd.zip | tee SNAPSHOT_SHA256.txt
          unzip -t MEHMET_AI_MODEL_ROUTER_a6b54bd.zip

      - name: Upload exact snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MEHMET_AI_MODEL_ROUTER_a6b54bd
          path: |
            MEHMET_AI_MODEL_ROUTER_a6b54bd.zip
            SNAPSHOT_SHA256.txt
          if-no-files-found: error
          retention-days: 90
