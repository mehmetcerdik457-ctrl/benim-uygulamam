name: Exact Model Router Snapshot

on:
  push:
    branches:
      - artifact/model-router-snapshot-20260925

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact router head
        uses: actions/checkout@v4
        with:
          ref: a6b54bd20bde56d4e80f259c6aa6b86685866488
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6b54bd20bde56d4e80f259c6aa6b86685866488"
          echo "EXACT_HEAD=PASS"

      - name: Build deterministic source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snapshot
          mkdir snapshot
          git ls-files -z | while IFS= read -r -d '' f; do
            mkdir -p "snapshot/$(dirname "$f")"
            cp "$f" "snapshot/$f"
          done
          (
            cd snapshot
            find . -type f -print0 | sort -z | xargs -0 sha256sum > FILE_SHA256SUMS.txt
          )
          python - <<'PY'
import os, zipfile
root="snapshot"
out="MEHMET_AI_MODEL_ROUTER_a6b54bd.zip"
with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED) as z:
    for base, dirs, files in os.walk(root):
        dirs.sort(); files.sort()
        for f in files:
            p=os.path.join(base,f)
            arc=os.path.relpath(p,root)
            info=zipfile.ZipInfo(arc, date_time=(1980,1,1,0,0,0))
            info.compress_type=zipfile.ZIP_DEFLATED
            info.external_attr=0o100644 << 16
            with open(p,"rb") as fh:
                z.writestr(info,fh.read())
PY
          sha256sum MEHMET_AI_MODEL_ROUTER_a6b54bd.zip > SNAPSHOT_SHA256.txt
          cat SNAPSHOT_SHA256.txt

      - name: Upload exact snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MEHMET_AI_MODEL_ROUTER_a6b54bd
          path: |
            MEHMET_AI_MODEL_ROUTER_a6b54bd.zip
            SNAPSHOT_SHA256.txt
          if-no-files-found: error
          retention-days: 90
