name: OMEGA MVI isolated tests

on:
  pull_request:
    paths:
      - 'omega_mvi/**'
      - 'compose.omega.yml'
      - '.github/workflows/omega-mvi-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omega-mvi-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip install --quiet -r omega_mvi/requirements-test.txt
      - name: Existing backend and MVI regression
        run: python3 -m pytest -q tests omega_mvi/tests
      - name: Isolated Compose static validation
        run: docker compose -f compose.omega.yml config -q
        env:
          OMEGA_DEV_DB_PASSWORD: "CI_PLACEHOLDER_NOT_REAL"
      - name: Start disposable demo and verify live health
        env:
          OMEGA_DEV_DB_PASSWORD: "CI_PLACEHOLDER_NOT_REAL"
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f compose.omega.yml down --remove-orphans' EXIT
          docker compose -f compose.omega.yml up -d --build --wait --wait-timeout 180
          # This private Docker network is intentionally internal. GitHub's runner may
          # not route the host-published loopback port; check service health INSIDE
          # the isolated network rather than silently disabling network isolation.
          docker compose -f compose.omega.yml exec -T api python -c 'import json,urllib.request; x=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)); assert x["status"]=="ok" and x["mode"]=="mock" and x["production_ready"] is False'
          echo "OMEGA_HOST_LOOPBACK_CONNECTIVITY=NOT_VERIFIED"
          echo "OMEGA_MVI_COMPOSE_HEALTH=PASS"
      - name: Confirm no production mode
        run: |
          grep -F 'production_ready' omega_mvi/app/main.py
          grep -F '127.0.0.1:18080:8000' compose.omega.yml
