name: Owner P256 Signed Chat
on:
  push:
    branches:
      - fix/owner-p256-failclosed-20261101
      - real-ai-backend-p1
      - integration/kral-omega-runtime-20261117
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'scripts/omega_provider_acceptance.py'
      - 'docs/OWNER_P256_BACKEND_CONTRACT.md'
      - '.github/workflows/owner-p256-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-p256:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile and test
        run: |
          set -o pipefail
          mkdir -p build/runtime-evidence
          python -m compileall -q backend tests scripts
          python -m pytest -q tests --junitxml=build/runtime-evidence/tests.xml 2>&1 | tee build/runtime-evidence/tests.log
          python scripts/security_selftest.py | tee build/runtime-evidence/security-selftest.log
          git rev-parse HEAD > build/runtime-evidence/source-commit.txt
      - name: Upload runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-omega-runtime-tests
          path: build/runtime-evidence/
          if-no-files-found: error

