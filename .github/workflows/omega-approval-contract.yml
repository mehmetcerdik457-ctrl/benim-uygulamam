name: OMEGA MVI-03 offline approval contract
on:
  push:
    branches:
      - omega/mvi-03-owner-approval-contract-20261011
  pull_request:
    paths:
      - 'omega_mvi/approval/**'
      - '.github/workflows/omega-approval-contract.yml'
permissions:
  contents: read
jobs:
  approval-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify synthetic-only owner approval contract
        run: |
          python3 -m pip install --quiet pytest==8.4.1
          python3 -m pytest -q omega_mvi/approval/test_contract.py
