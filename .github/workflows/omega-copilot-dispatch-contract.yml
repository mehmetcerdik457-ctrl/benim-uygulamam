name: OMEGA Copilot dispatch contract
on:
  pull_request:
    paths:
      - 'omega_mvi/copilot_dispatch/**'
      - '.github/workflows/omega-copilot-dispatch-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate adapter without live dispatch
        run: python -m unittest -v omega_mvi.copilot_dispatch.test_adapter
