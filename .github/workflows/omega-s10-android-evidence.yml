name: OMEGA S10 offline Android evidence APK
on:
  pull_request:
    paths:
      - 'omega_android_evidence/**'
      - '.github/workflows/omega-s10-android-evidence.yml'
  push:
    branches:
      - 'omega/s10-android-offline-evidence-*'
    paths:
      - 'omega_android_evidence/**'
      - '.github/workflows/omega-s10-android-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Java 17
        uses: actions/setup-java@a26af69be951a213d495a4c3e4e4022e16d87065 # v4.7? pinned
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle without publishing scans
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 pinned
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Configure Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4 pinned
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install fixed Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, lint and debug APK
        run: gradle -p omega_android_evidence --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify installable debug signature, permissions and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="omega_android_evidence/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump permissions "$apk" > "$RUNNER_TEMP/omega-permissions.txt"
          if grep -q "uses-permission:" "$RUNNER_TEMP/omega-permissions.txt"; then
            echo "OMEGA_ANDROID_PERMISSIONS=BLOCKED"
            exit 2
          fi
          sha256sum "$apk" > "${apk}.sha256"
          echo "OMEGA_ANDROID_DEBUG_APK=SIGNED_BY_EPHEMERAL_DEBUG_KEY"
          echo "OMEGA_ANDROID_NO_MANIFEST_PERMISSIONS=PASS"
          echo "OMEGA_ANDROID_RELEASE_APPROVAL=NOT_ACCEPTED"
      - name: Preserve debug APK and checksums for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: omega-s10-offline-evidence-debug
          path: |
            omega_android_evidence/app/build/outputs/apk/debug/app-debug.apk
            omega_android_evidence/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
