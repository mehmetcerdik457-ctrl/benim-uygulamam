name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile Python before tests
        run: python -m compileall -q .
      - name: Run repository and inspection regressions
        run: |
          python -m pip install --quiet -r requirements.txt -r omega_mvi/requirements-test.txt
          PYTHONPATH=.:omega_mvi python -m pytest -q
