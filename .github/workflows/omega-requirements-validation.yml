name: OMEGA 100-requirement matrix validation

on:
  push:
    branches:
      - omega/requirements-matrix-20261011
  pull_request:
    paths:
      - 'docs/OMEGA_REQUIREMENTS_MATRIX.csv'
      - 'tests/test_omega_matrix.py'
      - '.github/workflows/omega-requirements-validation.yml'

permissions:
  contents: read

jobs:
  requirement-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install isolated test dependency
        run: python3 -m pip install --quiet pytest==8.4.1
      - name: Verify all 100 requirements and their exact source text
        run: python3 -m pytest -q tests/test_omega_matrix.py
      - name: Preserve legacy backend regression
        run: python3 -m pytest -q tests/test_backend_contract.py tests/test_placeholder.py
