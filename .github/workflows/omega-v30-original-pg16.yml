name: OMEGA V30 ORIGINAL skipped 16 - isolated PostgreSQL
on:
  push:
    branches: [audit/omega-v30-original-pg16-20261111]
    paths:
      - 'evidence/omega_v30_pg16_source.tar.br.b64'
      - 'scripts/omega_v30_original_pg16.py'
      - '.github/workflows/omega-v30-original-pg16.yml'
  pull_request:
    paths:
      - 'evidence/omega_v30_pg16_source.tar.br.b64'
      - 'scripts/omega_v30_original_pg16.py'
      - '.github/workflows/omega-v30-original-pg16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-postgres-sixteen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omega_test_v30
          POSTGRES_USER: omega_v30
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omega_v30 -d omega_test_v30"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OMEGA_TEST_POSTGRES_DSN: postgresql://omega_v30:ci-ephemeral-only@127.0.0.1:5432/omega_test_v30
      PYTHONPATH: ./v30_pg16_original
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install only source extraction and PG test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<3.4' 'brotli>=1.1,<2'
      - name: Verify SHA-256 and reconstruct 8 unchanged V30 files
        run: python scripts/omega_v30_original_pg16.py
      - name: Run original V30 8 queue + 8 audit PostgreSQL tests
        shell: bash
        run: |
          set -euo pipefail
          cd v30_pg16_original
          python -m unittest discover -s tests -p 'test_postgres*live.py' -v 2>&1 | tee ../v30-pg16.log
          grep -Eq '^Ran 16 tests in ' ../v30-pg16.log
          grep -Eq '^OK$' ../v30-pg16.log
          if grep -Eq 'skipped|SKIP|FAILED|ERROR' ../v30-pg16.log; then
            echo 'V30 ORIGINAL 16 TESTS NOT ACCEPTED'
            exit 1
          fi
          echo 'V30_ORIGINAL_POSTGRES_16=PASS_NO_SKIP'
          echo 'ORBA_MONETIZATION_PRODUCTION=NOT_VERIFIED'
