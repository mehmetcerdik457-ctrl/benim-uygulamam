name: Privacy Guard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject private state filenames (no log disclosure)
        shell: bash
        run: python3 scripts/omega_privacy_filename_check.py
      - name: Scan text files for credential markers
        shell: bash
        run: |
          set -euo pipefail
          markers='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk-(proj-)?[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{20,}'
          set +e
          git grep -I -q -E "$markers" -- .
          scan_status=$?
          set -e
          case "$scan_status" in
            0) echo "Potential credential material detected."; exit 1 ;;
            1) echo "PRIVACY_GUARD=PASS" ;;
            *) echo "Privacy scan failed; fail-closed."; exit 1 ;;
          esac
