name: Privacy Guard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(sk-proj-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- ':!.env.example'; then
            echo 'Potential credential pattern detected; review without exposing values.'
            exit 1
          fi
          echo 'PRIVACY_PATTERN_GUARD=PASS'
