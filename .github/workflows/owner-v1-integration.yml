name: Owner Device-Signed HTTP Integration
on:
  push:
    branches:
      - integration/owner-device-signatures-20261020
  pull_request:
permissions:
  contents: read
jobs:
  auth-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Run actual HTTP cryptographic integration and regressions
        run: python -m pytest -q tests/test_backend_owner_v1.py tests/test_backend_contract.py tests/test_backend_http_audit.py
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Build container and inspect local-only Compose
        run: |
          docker build --pull=false -t omega-owner-v1:test .
          OPENAI_API_KEY=SYNTHETIC_KEY_NOT_REAL docker compose config --quiet
