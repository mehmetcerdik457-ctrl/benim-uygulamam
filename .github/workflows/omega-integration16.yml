name: OMEGA Integration 16 exact-HEAD offline gate
on:
  pull_request:
    branches:
      - omega/ui-security-and-ci-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "OMEGA_INTEGRATION_SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Privacy and syntax guards
        run: |
          python scripts/omega_privacy_filename_check.py
          python scripts/omega_safe_secret_scan.py
          python -m compileall -q omega_mvi scripts tests
          bash -n scripts/omega_ops_isolated_restore.sh
      - name: Source-only lint and scoped static type-check
        run: |
          python -m pip install --quiet ruff==0.13.2 mypy==1.18.2
          ruff check --select E4,E7,E9,F63,F7,F82 omega_mvi/inspection/provenance/policy.py scripts/omega_network_topology_gate.py tests/test_omega_network_topology_gate.py tests/test_omega_integration16_cross_module.py
          mypy --follow-imports=skip --ignore-missing-imports --check-untyped-defs scripts/omega_network_topology_gate.py
      - name: Verify policy topology without pretending host access
        run: |
          set -euo pipefail
          OMEGA_DEV_DB_PASSWORD=CI_PLACEHOLDER_NOT_REAL docker compose -f compose.omega.yml config --format json | python scripts/omega_network_topology_gate.py --stdin
      - name: Combined complete offline regressions
        env:
          PYTHONPATH: .:omega_mvi
        run: |
          python -m pip install --quiet -r omega_mvi/requirements-test.txt
          python -m pytest -q -ra
