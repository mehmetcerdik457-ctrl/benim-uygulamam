name: OMEGA security offline fixture contracts
on:
  push:
    branches:
      - omega/security-identity-offline-contracts-20261011
  pull_request:
    paths:
      - 'omega_mvi/security/**'
      - 'tests/test_omega_security_offline.py'
      - 'tests/test_omega_oidc_fixture.py'
      - 'tests/test_omega_audit_fixture.py'
      - 'tests/test_omega_incident_fixture.py'
      - 'tests/test_omega_recovery_fixture.py'
      - 'tests/test_omega_resource_boundary.py'
      - '.github/workflows/omega-security-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Only isolated synthetic security tests (no credentials or IdP)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==8.4.1 cryptography==46.0.4
          python -m pytest -q -ra tests/test_omega_security_offline.py tests/test_omega_oidc_fixture.py tests/test_omega_audit_fixture.py tests/test_omega_incident_fixture.py tests/test_omega_recovery_fixture.py tests/test_omega_resource_boundary.py
