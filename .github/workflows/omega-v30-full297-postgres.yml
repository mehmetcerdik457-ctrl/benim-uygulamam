name: OMEGA V30 patched FULL 297 on isolated PostgreSQL
on:
  push:
    branches: [audit/omega-v30-original-pg16-20261111]
    paths:
      - 'evidence/omega_v30_sourceonly_*.b64'
      - 'scripts/omega_v30_sourceonly_ci.py'
      - '.github/workflows/omega-v30-full297-postgres.yml'
  pull_request:
    paths:
      - 'evidence/omega_v30_sourceonly_*.b64'
      - 'scripts/omega_v30_sourceonly_ci.py'
      - '.github/workflows/omega-v30-full297-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-297-single-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omega_test_v30
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-admin-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d omega_test_v30"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OMEGA_TEST_POSTGRES_DSN: postgresql://omega_v30:ci-ephemeral-test-only@127.0.0.1:5432/omega_test_v30
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated test runtime
        run: python -m pip install 'brotli>=1.1,<2' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<3.4'
      - name: Create least-privilege disposable PostgreSQL test role
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://ci_admin:ci-admin-ephemeral-only@127.0.0.1:5432/omega_test_v30") as conn:
              conn.execute("CREATE ROLE omega_v30 LOGIN PASSWORD 'ci-ephemeral-test-only'")
              conn.execute("GRANT CREATE ON DATABASE omega_test_v30 TO omega_v30")
          with psycopg.connect("postgresql://omega_v30:ci-ephemeral-test-only@127.0.0.1:5432/omega_test_v30") as conn:
              db, user, superuser, create = conn.execute(
                  "SELECT current_database(), current_user, "
                  "(SELECT rolsuper FROM pg_roles WHERE rolname=current_user), "
                  "has_database_privilege(current_user, current_database(), 'CREATE')"
              ).fetchone()
              assert (db, user, superuser, create) == ("omega_test_v30", "omega_v30", False, True)
          print("V30_EPHEMERAL_NON_SUPERUSER_POSTGRES_VERIFIED=TRUE")
          PY
      - name: Reconstruct original V30 source and verify its SHA-256
        run: python scripts/omega_v30_sourceonly_ci.py
      - name: Apply narrow checksum-pinned candidate fix (not original archive)
        run: python scripts/omega_v30_patch_candidate.py
      - name: Run exactly all 297 original tests on real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd v30_pg16_original
          python -m unittest discover -s tests -v 2>&1 | tee ../v30-full297.log
          grep -Eq '^Ran 297 tests in ' ../v30-full297.log
          grep -x 'OK' ../v30-full297.log
          if grep -Eq 'skipped|SKIP|FAILED|ERROR' ../v30-full297.log; then
            echo 'V30 FULL 297 NOT ACCEPTED'
            exit 1
          fi
          echo 'V30_PATCHED_FULL_297=297_PASS_0_SKIP'
          echo 'ORBA_MONETIZATION_PRODUCTION=NOT_VERIFIED'
