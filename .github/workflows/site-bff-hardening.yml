name: Sites BFF Hardening
on:
  push:
    branches: [site-bff-hardening-20260929]
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q runtime_v022_server.py runtime_security.py tests scripts
      - name: Security unit tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_runtime_security.py
      - name: Deployment security self-test
        run: python scripts/runtime_security_selftest.py
