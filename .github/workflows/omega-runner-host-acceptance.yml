name: OMEGA runner-host acceptance (separate P0 gate)
on:
  pull_request:
    paths:
      - 'compose.omega.yml'
      - 'omega_mvi/ingress/**'
      - 'scripts/omega_probe_runner_loopback.py'
      - 'scripts/omega_runner_host_diagnostic.py'
      - 'scripts/omega_runner_host_port_audit.py'
      - 'scripts/omega_runner_host_direct_route.py'
      - 'scripts/omega_ci_ephemeral_loopback_relay.py'
      - 'tests/test_omega_ci_ephemeral_loopback_relay.py'
      - 'tests/test_omega_runner_host_direct_route.py'
      - 'tests/test_omega_runner_host_port_audit.py'
      - 'tests/test_omega_runner_host_diagnostic.py'
      - '.github/workflows/omega-runner-host-acceptance.yml'
permissions:
  contents: read
jobs:
  runner-host-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm network and publish config without printing credentials
        run: |
          python3 -c "from pathlib import Path; s=Path('compose.omega.yml').read_text(); assert 'internal: true' in s; assert '127.0.0.1:18080:8080' in s; assert '0.0.0.0:18080' not in s; print('OMEGA_PORT_POLICY=PASS')"
      - name: Generate disposable database password only for this isolated job
        run: |
          pw="$(openssl rand -hex 18)"
          echo "::add-mask::$pw"
          echo "OMEGA_DEV_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Confirm rendered Compose isolation separately from live connectivity
        run: |
          set -euo pipefail
          docker compose --profile integration -f compose.omega.yml config --format json | python3 scripts/omega_network_topology_gate.py --stdin
      - name: Test positive and negative Docker port audit outcomes (synthetic)
        run: python3 -m unittest discover -s tests -p test_omega_runner_host_port_audit.py -v
      - name: Test direct host-to-internal route classifications (synthetic)
        run: python3 -m unittest discover -s tests -p test_omega_runner_host_direct_route.py -v
      - name: Test ephemeral localhost-only relay with real synthetic TCP sockets
        run: python3 -m unittest discover -s tests -p test_omega_ci_ephemeral_loopback_relay.py -v
      - name: Start disposable containers with unchanged Compose isolation
        run: docker compose -f compose.omega.yml up -d --build --wait --wait-timeout 120 db api ingress
      - name: Classify isolated ingress startup failure without leaking logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker compose -f compose.omega.yml ps -aq ingress 2>/dev/null || true)"
          if [ -z "$cid" ]; then
            echo "OMEGA_INGRESS_STARTUP_DIAG=NO_DISPOSABLE_CONTAINER"
          else
            docker logs "$cid" 2>&1 | python3 -c '
          import sys
          raw = sys.stdin.read(16384).lower()
          checks = (
              ("HOSTNAME_RESOLUTION", "host not found in upstream"),
              ("NGINX_CONFIGURATION", "nginx: configuration file"),
              ("FILE_PERMISSION", "permission denied"),
              ("MISSING_FILESYSTEM", "no such file or directory"),
              ("BIND_LISTENER", "bind() to"),
              ("UNSUPPORTED_DIRECTIVE", "unknown directive"),
              ("UPSTREAM_FAILURE", "connect() failed"),
          )
          category = next((label for label, match in checks if match in raw), "UNCLASSIFIED")
          print("OMEGA_INGRESS_STARTUP_DIAG=" + category)
          '
          fi
      - name: Observe Docker binding, network, runner TCP and HTTP independently
        run: python3 scripts/omega_runner_host_diagnostic.py
      - name: Probe host-to-internal-container HTTP without network changes
        run: python3 scripts/omega_runner_host_direct_route.py
      - name: Prove temporary CI-only localhost relay and stop before acceptance
        run: python3 scripts/omega_ci_ephemeral_loopback_relay.py --ci-disposable
      - name: Enforce requested versus EFFECTIVE Docker host port mapping
        if: success() || failure()
        run: python3 scripts/omega_runner_host_port_audit.py
      - name: Enforce independent runner-host connectivity acceptance
        if: success() || failure()
        run: python3 scripts/omega_runner_host_diagnostic.py --require-runner-host
      - name: Clean up ONLY containers and temporary volumes made in this CI runner
        if: always()
        run: docker compose -f compose.omega.yml --profile integration down --volumes --remove-orphans
