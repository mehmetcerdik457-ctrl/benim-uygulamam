name: Master Roadmap Guard

on:
  push:
    branches: [ai-master-roadmap]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  roadmap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify master control files
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_MASTER_ROADMAP.md
          test -s CURRENT_STATE.md
          grep -F "REAL_AI_BACKEND" CURRENT_STATE.md
          grep -F "Phase 1 — Real AI backend" AI_MASTER_ROADMAP.md
          echo "MASTER_ROADMAP_FILES=PASS"

      - name: Run repository tests
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Quiet fail-closed secret and filename guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega_privacy_filename_check.py
          python3 scripts/omega_safe_secret_scan.py
