name: Master Roadmap Guard

on:
  push:
    branches: [ai-master-roadmap]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  roadmap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify master control files
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_MASTER_ROADMAP.md
          test -s CURRENT_STATE.md
          grep -F "REAL_AI_BACKEND" CURRENT_STATE.md
          grep -F "Phase 1 — Real AI backend" AI_MASTER_ROADMAP.md
          echo "MASTER_ROADMAP_FILES=PASS"

      - name: Run repository tests
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Basic secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk-proj-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- ':!*.md' ':!.env.example'; then
            echo "Potential live secret detected"
            exit 1
          fi
          echo "SECRET_PATTERN_GUARD=PASS"
